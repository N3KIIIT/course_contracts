syntax = "proto3";

package account;
option go_package = "github.com/N3KIIIT/contracts/account/go;account";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "account_model.proto";
import "pagination/pagination.proto";

service Account {
   
    rpc CreateUser(CreateUserRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            post: "account/api/v1/users"
            body: "*"
        };
    }

    rpc GetUser(GetUserRequest) returns (GetUserResponse) {
        option (google.api.http) = {
            get: "account/api/v1/users/{id}"
        };
    }

    rpc GetUsers(GetUsersRequest) returns (GetUsersResponse) {
        option (google.api.http) = {
            get: "account/api/v1/users"
        };
    }

    rpc UpdateUser(UpdateUserRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            put: "account/api/v1/users/{id}"
            body: "*"
        };
    }

    rpc DeleteUser(DeleteUserRequest) returns (google.protobuf.Empty) {
        option (google.api.http) = {
            delete: "account/api/v1/users/{id}"
        };
    }
}
 message CreateUserRequest {
    CreateUser user = 1;
}

message GetUserRequest {
    string  id = 1;
}

message GetUserResponse {
    User user = 1;
}

message GetUsersRequest {
    pagination.Pagination pagination = 1;
}

message GetUsersResponse {
    repeated User users = 1;
    pagination.Pagination pagination = 2;
}

message UpdateUserRequest {
    string  id = 1;
    User    user = 2;
}

message DeleteUserRequest {
    string  id = 1;
}