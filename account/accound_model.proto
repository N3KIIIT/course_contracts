syntax = "proto3";

package account;
option go_package = "github.com/N3KIIIT/contracts/account/go;account";

message CreateUser {
    string login = 1;
    string phone = 2;
    string email = 3;
    string first_name = 4;
    string last_name = 5;
    string middle_name = 6;
    uint16 age = 7;
}

message User {
    uuid id = 1;
    string login = 2;
    string phone = 3;
    string email = 4;
    string first_name = 5;
    string last_name = 6;
    string middle_name = 7;
    uint16 age = 8;
    google.protobuf.Timestamp created_at = 9;
    google.protobuf.Timestamp updated_at = 10;
}